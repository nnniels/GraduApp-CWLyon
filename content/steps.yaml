# Library of steps. An itinerary only lists step ids, so a step can be shared between itineraries.
# Exactly one of `riddle` or `challenges` per step. Codes are validated by the supervisor: keep them quoted.
# location.kind: text (text) | maps_link (url) | minimap (lat, lon). `label` is optional.
steps:
  - id: place-bellecour
    location: {kind: text, text: "Statue of Louis XIV, Place Bellecour"}
    code: "1337"
    unlocks: [find-communist-poster]
    points: 2
    challenges:
      k: 2
      duration_s: 600
      items:
        - {id: bellecour-human-pyramid, text: "Build a human pyramid of 3 levels", points: 2}
        - {id: bellecour-sing, text: "Sing the national anthem together"}
        - {id: bellecour-count-lamps, text: "Count the lamp posts around the statue"}

  - id: tour-metallique
    location: {kind: maps_link, url: "https://maps.google.com/?q=45.7624,4.8222", label: "Fourviere"}
    code: "1337"
    riddle:
      text: "I have cities but no houses, mountains but no trees, water but no fish. What am I?"

  - id: place-terreaux
    location: {kind: minimap, lat: 45.7676, lon: 4.8338, label: "Place des Terreaux"}
    code: "1337"
    unlocks: [fountain-pose]
    riddle:
      text: "What is the name of the sculptor of the fountain?"

  - id: theatre-gallo-romain
    location: {kind: text, text: "Théâtre Gallo-romain, Fourvière"}
    code: "2101"
    riddle:
      text: "I was built for voices two thousand years ago and still hold the echo of applause. What am I?"

  - id: jardin-des-curiosites
    location: {kind: text, text: "Jardin des Curiosités, Lyon"}
    code: "2202"
    riddle:
      text: "I hide wonders behind a gate, yet I am open to the curious. What am I?"

  - id: traboules
    location: {kind: text, text: "Traboules du Vieux Lyon"}
    code: "2303"
    riddle:
      text: "I am a passage that cuts through buildings, shortcut for silk weavers. What am I?"

  - id: guignol
    location: {kind: text, text: "Guignol, Vieux Lyon"}
    code: "2404"
    riddle:
      text: "I wear a red cap, I speak in a loud voice, and I always win in the end. Who am I?"

  - id: passerelle
    location: {kind: text, text: "Passerelle, Lyon"}
    code: "2505"
    riddle:
      text: "I connect two banks without ever touching the water. What am I?"

  - id: fresque
    location: {kind: text, text: "Fresque des Lyonnais, Croix-Rousse"}
    code: "2606"
    riddle:
      text: "I tell the story of a city in colours on a wall, and no one can walk inside me. What am I?"

  - id: amphitheatre-3-gaules
    location: {kind: text, text: "Amphithéâtre des Trois Gaules, Croix-Rousse"}
    code: "2707"
    riddle:
      text: "Three provinces once met in my arena to honour an emperor. What is my name?"

  - id: gros-caillou
    location: {kind: text, text: "Gros Caillou, Lyon"}
    code: "2808"
    riddle:
      text: "I am a big stone that never moves, yet I am the name of a spot in the city. What am I?"

  - id: berges-du-rhone
    location: {kind: text, text: "Berges du Rhône, Lyon"}
    code: "2909"
    riddle:
      text: "I flow quietly along the city's edge, never stopping and never returning. What am I?"

  - id: guillotiere
    location: {kind: text, text: "Quartier de la Guillotière, Lyon"}
    code: "3011"
    riddle:
      text: "I am a neighbourhood named after a blade, yet I am full of markets and life. What am I?"

  - id: parc-tete-d-or
    location: {kind: text, text: "Parc de la Tête d'Or, Lyon"}
    code: "3112"
    riddle:
      text: "I am a park with a lake, a rose garden and a zoo, and I was named after a golden head. What am I?"
