# Library of steps. An itinerary only lists step ids, so a step can be shared between itineraries.
# Exactly one of `riddle` or `challenges` per step. Codes are validated by the supervisor: keep them quoted.
# location.kind: text (text) | maps_link (url) | minimap (lat, lon). `label` is optional.
# Optional `get_there: "..."` replaces the default "Go to this location" heading on the "Go to" screen.
# Optional `fun_fact: "..."` (quoted string) is shown under the directions on the "Go to" screen.
steps:
  - id: place-bellecour
    location: {kind: text, text: "Statue of Louis XIV, Place Bellecour"}
    code: "1337"
    fun_fact: "At about 300 m by 200 m, Place Bellecour is one of the largest open squares in Europe."
    unlocks: [find-communist-poster, protest-tourist-office]
    points: 2
    challenges:
      k: 2
      duration_s: 600
      items:
        - {id: bellecour-eat, text: "Eat a crep at Emna's", points: 2}
        - {id: bellecour-king, text: "Make a polite reverence to king Louis XIV", points: 2}

  - id: fourviere
    location: {kind: maps_link, url: "https://maps.google.com/?q=45.7624,4.8222", label: "Fourvière"}
    code: "1337"
    get_there: "Walk up the steep, scenic stairs of Montée des Chazes to the very top of the hill, or take the Ficelle."
    fun_fact: "I was built in the 19th century with white stone, gold, and mosaic, financed entirely by the locals to thank the Virgin Mary for saving the city from a terrible plague. Right next to me stands a metallic tower, built by a local engineer to look exactly like the top floor of the Eiffel Tower in Paris. "
    unlocks: [red-velov-fourviere]
    riddle:
      title: "Who's most likely to ?"
      text: "Who’s most likely to say “I’ll be there in five minutes” while still choosing what to wear?"

  - id: place-terreaux
    location: {kind: minimap, lat: 45.7676, lon: 4.8338, label: "Place des Terreaux"}
    code: "1337"
    fun_fact: "My floor features 69 fountains that spit water from the ground. On one side, I hold a majestic 17th-century fountain made of 21 tons of lead, showing four wild water horses representing France's rivers. Just behind the city hall, my neighbor is a neoclassical temple coiffed with a modern, glowing glass dome."
    unlocks: [swing]
    riddle:
      title: "Question"
      text: "What is the name of the sculptor of the fountain?"

  - id: theatre-gallo-romain
    location: {kind: maps_link, url: "https://maps.app.goo.gl/vjbaeWPFnUXiYbMi7", label: "Théâtre Gallo-romain, Fourvière"}
    code: "1337"
    fun_fact: "I am the oldest landmark in the city, ordered by Emperor Augustus in 15 BC. For centuries, 10,000 Roman citizens would sit on my giant stone semi-circle steps to watch comedies and tragedies. Today, I am still alive and hosting music festivals every summer under the stars."
    challenges:
      k: 2
      duration_s: 900
      items:
        - {id: amphi-whisper, text: "Thoroughly test the accoustic of the Amphitheatre", points: 2}
        - {id: amphi-throw, text: "Throw an object from the top. Somebody at the bottom of the Amphitheatre must catch it.", points: 8}
        - {id: amphi-theatre, text: "You are a comedian from 20 AD. Improvise a roman tragedy.", points: 6}
        - {id: amphi-teams, text: "Send an outlook email to Emna asking if the Crêpes are ready yet.", points: 3}


  - id: jardin-des-curiosites
    location: {kind: maps_link, url: "https://maps.app.goo.gl/tXYyFqv39kc6Lcmq8", label: "Jardin des Curiosités, Lyon"}
    code: "1337"
    fun_fact: "I am a secret panoramic terrace. To celebrate the 20th anniversary of our friendship, the city of Montreal in Canada gave me as a gift to the people of Lyon. My grass hides six heavy metal chairs bolted into the ground, each engraved with a poetic thought to guide your eyes over the city skyline."
    riddle:
      title: "Who's most likely to ?"
      text: "Who’s most likely to befriend a stranger in a queue and learn their entire life story?"

  - id: traboules
    location: {kind: text, text: "Traboule du 54 rue Saint-Jean (Vieux Lyon)"}
    code: "1337"
    fun_fact: "My name comes from the Latin 'trans-ambulare', which means 'to walk through'. I am a secret Renaissance corridor built in the 15th century. I allowed silk merchants and residents to cross from one street to another through buildings and hidden courtyards without getting wet when it rained, and later helped the French Resistance hide from the Nazis."
    riddle:
      title: "Who's most likely to ?"
      text: "Who’s most likely to get everyone laughing at exactly the wrong moment?"

  - id: passage-mermet
    location: {kind: maps_link, url: "https://maps.app.goo.gl/iH2rdbeszUzQ3Ygy9", label: "Passage Mermet & Escalier"}
    code: "1337"
    riddle:
      title: "Question"
      text: "Count the staircase in the passage."

  - id: guignol
    location: {kind: text, text: "Horloge de Guignol, Vieux Lyon"}
    code: "1337"
    fun_fact: "I sit on the facade of the House of the Sun. Since 1867, I have been hosting the characters of Lyon’s traditional puppet show. Every hour, Guignol and his friend Gnafron move automatically to strike the bells with their wooden sticks to tell the neighborhood the time."
    unlocks: [bouchon-bottle-stopper, guignol-clock-chime]
    riddle:
      title: "Who’s most likely to ?"
      text: "Who’s most likely to have a “quick coffee” that becomes a full afternoon?"

  - id: passerelle
    location: {kind: text, text: "Passerelle Saint-Georges, Lyon"}
    code: "1337"
    fun_fact: " If you stand in my center, you get a perfect postcard view: behind you is the old St. Georges church, and right in front of you are the massive, intimidating Greek columns of the 19th-century Law Courts."
    points: 2
    challenges:
      k: 2
      duration_s: 600
      items:
        - {id: footbridge-jump, text: "All team members jump together on the Saint-Georges footbridge", points: 4}
        - {id: footbridge-statue, text: "Take the pose of the two statues", points: 8}
        - {id: footbridge-selfie, text: "Take a selfie on the bridge and send it to Alex", points: 2}

  - id: fresque
    location: {kind: maps_link, url: "https://maps.app.goo.gl/uP6zsAV2YG1atDcf7", label: "Fresque des Lyonnais, Croix-Rousse"}
    code: "1337"
    unlocks: [ikea-meatballs, bus-honk-wave]
    riddle:
      title: "Who’s most likely to ?"
      text: "Who’s most likely to start a new hobby with intense enthusiasm and all the equipment, then giving up in 2 weeks?"

  - id: amphitheatre-3-gaules
    location: {kind: maps_link, url: "https://maps.app.goo.gl/XygXnDqaK9VYphAY6", label: "Amphithéâtre des Trois Gaules, Croix-Rousse"}
    code: "1337"
    fun_fact: "Built in 19 AD, I am the exact place where the leaders of the 60 Celtic tribes of Gaule gathered every year to pledge their allegiance to Rome and Emperor Augustus. I am also the tragic sanctuary where the very first Christian martyrs of France were executed in the arena."
    riddle:
      title: "Who's most likely to ?"
      text: "Who’s most likely to accidentally become the unofficial project manager ?"
    
  - id: gros-caillou
    location: {kind: maps_link, url: "https://maps.app.goo.gl/yUuzRrMGzbvT7TfSA", label: "Gros Caillou, Lyon"}
    code: "1337"
    fun_fact: "Geologists discovered that I don't belong here: I was dragged all the way from the French Alps to this hilltop 140,000 years ago by a giant melting glacier during the Ice Age. I became the ultimate symbol of the proud silk-weavers who lived on this hill. "
    riddle:
      title: "Who’s most likely to ?"
      text: "Who’s most likely to volunteer for something before finding out what it involves?"

  - id: berges-du-rhone
    location: {kind: text, text: "Berges du Rhône, Lyon"}
    code: "1337"
    riddle:
      title: "Who’s most likely to ?"
      text: "Who’s most likely to make a colour-coded binder for even a small plan?"

  - id: guillotiere
    location: {kind: maps_link, url: "https://maps.app.goo.gl/aJGef5jjidCpnRTy5", label: "Quartier de la Guillotière, Lyon"}
    code: "0000"
    fun_fact: "[IMPORTANT] Ask Marie before going. Code is 0000"
    riddle:
      title: "Riddle"
