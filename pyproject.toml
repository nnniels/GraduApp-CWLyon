[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graduapp"
version = "0.1.0"
description = "Mobile treasure-hunt web app (Flask + HTMX + SQLite)"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "Flask-Limiter>=3.5",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
prod = ["gunicorn>=21.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["graduapp*"]

[tool.setuptools.package-data]
graduapp = ["db/schema.sql", "web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
