{% set general = scope == 'general' %}
{% import "partials/ui.html" as ui %}
{% call ui.popup(challenge.text) %}
    {% if challenge_ticked %}
      {% if proof %}<p class="proof">{{ proof }}</p>{% endif %}
      <form hx-post="{{ url_for('game.general_untick' if general else 'game.untick') }}" hx-disabled-elt="find button">
        {% if not general %}<input type="hidden" name="step_index" value="{{ step_index }}">{% endif %}
        <input type="hidden" name="challenge_id" value="{{ challenge.id }}">
        <button type="submit" class="btn-danger">Challenge uncompleted</button>
      </form>
    {% else %}
      <form hx-post="{{ url_for('game.general_tick' if general else 'game.tick') }}" hx-disabled-elt="find button">
        {% if not general %}<input type="hidden" name="step_index" value="{{ step_index }}">{% endif %}
        <input type="hidden" name="challenge_id" value="{{ challenge.id }}">
        <label>Note (optional)
          <input name="text" maxlength="500" autocomplete="off">
        </label>
        <button type="submit" class="btn-accent challenge-complete">Challenge completed</button>
      </form>
    {% endif %}
    <button type="button" class="btn" onclick="document.getElementById('modal').innerHTML=''">Close</button>
{% endcall %}
