<div class="overlay">
  <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <h2 id="popup-title">{{ challenge.text }}</h2>
    {% if challenge_ticked %}
      {% if proof %}<p class="proof">{{ proof }}</p>{% endif %}
      <form hx-post="{{ url_for('game.untick') }}" hx-disabled-elt="find button">
        <input type="hidden" name="step_index" value="{{ step_index }}">
        <input type="hidden" name="challenge_id" value="{{ challenge.id }}">
        <button type="submit" class="danger">Challenge uncompleted</button>
      </form>
    {% else %}
      <form hx-post="{{ url_for('game.tick') }}" hx-disabled-elt="find button">
        <input type="hidden" name="step_index" value="{{ step_index }}">
        <input type="hidden" name="challenge_id" value="{{ challenge.id }}">
        <label>Note (optional)
          <input name="text" maxlength="500" autocomplete="off">
        </label>
        <button type="submit">Challenge completed</button>
      </form>
    {% endif %}
    <button type="button" class="secondary" onclick="document.getElementById('modal').innerHTML=''">Close</button>
  </div>
</div>
